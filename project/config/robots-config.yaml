  # 机器人行为算法配置 - 更随机真实
  behavior_algorithm:
    # 动态发布概率 - 增加随机性
    post_probability:
      base_rate: 0.25
      time_multiplier: 1.8
      user_interaction_multiplier: 1.3
      content_quality_multiplier: 1.2
      mood_multiplier: 1.4  # 情绪影响
      random_factor: 0.3  # 随机因子
      
    # 评论发布概率 - 更自然
    comment_probability:
      base_rate: 0.35
      post_relevance_multiplier: 1.4
      user_relationship_multiplier: 1.3
      time_since_post_multiplier: 0.7
      interest_match_multiplier: 1.5  # 兴趣匹配
      random_factor: 0.4
      
    # 回复发布概率 - 更真实
    reply_probability:
